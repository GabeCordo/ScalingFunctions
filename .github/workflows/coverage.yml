name: Coverage Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Generate Coverage Report and Badge
        run: |
          mkdir -p coverage
          go test ./... -covermode=atomic -coverprofile=coverage/coverage.out
          go tool cover -html=coverage/coverage.out -o coverage/index.html
          
          # Calculate total coverage percentage
          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total: | awk '{print $3}')
          echo "Total coverage: $COVERAGE"
          
          # Generate SVG badge
          python3 -c "
          import sys, re

          cov_str = '$COVERAGE' if '$COVERAGE' else '0.0%'
          match = re.search(r'([0-9]+(?:\.[0-9]+)?)', cov_str)
          val = float(match.group(1)) if match else 0.0

          if val >= 80:
              color = '#4c1'
          elif val >= 60:
              color = '#dfb317'
          else:
              color = '#e05d44'

          svg = f'''<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"110\" height=\"20\" role=\"img\" aria-label=\"coverage: {cov_str}\">
            <title>coverage: {cov_str}</title>
            <linearGradient id=\"s\" x2=\"0\" y2=\"100%\">
              <stop offset=\"0\" stop-color=\"#bbb\" stop-opacity=\".1\"/>
              <stop offset=\"1\" stop-opacity=\".1\"/>
            </linearGradient>
            <clipPath id=\"r\">
              <rect width=\"110\" height=\"20\" rx=\"3\" fill=\"#fff\"/>
            </clipPath>
            <g clip-path=\"url(#r)\">
              <rect width=\"63\" height=\"20\" fill=\"#555\"/>
              <rect x=\"63\" width=\"47\" height=\"20\" fill=\"{color}\"/>
              <rect width=\"110\" height=\"20\" fill=\"url(#s)\"/>
            </g>
            <g fill=\"#fff\" text-anchor=\"middle\" font-family=\"Verdana,Geneva,DejaVu Sans,sans-serif\" text-rendering=\"geometricPrecision\" font-size=\"110\">
              <text x=\"325\" y=\"150\" fill=\"#010101\" fill-opacity=\".3\" transform=\"scale(.1)\" textLength=\"530\">coverage</text>
              <text x=\"325\" y=\"140\" transform=\"scale(.1)\" fill=\"#fff\" textLength=\"530\">coverage</text>
              <text x=\"855\" y=\"150\" fill=\"#010101\" fill-opacity=\".3\" transform=\"scale(.1)\" textLength=\"370\">{cov_str}</text>
              <text x=\"855\" y=\"140\" transform=\"scale(.1)\" fill=\"#fff\" textLength=\"370\">{cov_str}</text>
            </g>
          </svg>'''

          with open('coverage/badge.svg', 'w') as f:
              f.write(svg)

          import json
          if val >= 80:
              shields_color = 'brightgreen'
          elif val >= 60:
              shields_color = 'yellow'
          else:
              shields_color = 'red'

          endpoint_data = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": cov_str,
              "color": shields_color
          }
          with open('coverage/coverage.json', 'w') as f:
              json.dump(endpoint_data, f)
          "

      - name: Deploy Coverage Report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: coverage
          branch: gh-pages
